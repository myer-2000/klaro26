openapi: 3.1.0
info:
  title: Klaro26 Research API
  version: "2026.1"
  license:
    name: MIT
  description: >
    A question in — papers, patents, news, companies and a cited timeline
    out. Research built for agents, not humans.
servers:
  - url: http://localhost:8084
paths:
  /research:
    post:
      summary: Run a research query.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                depth:
                  type: string
                  enum: [quick, standard, deep]
      responses:
        "202":
          description: Job accepted.
  /research/{id}:
    get:
      summary: Fetch job status and result.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
