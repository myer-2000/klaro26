openapi: 3.1.0
info:
  title: Klaro26 Video Knowledge API
  version: "2026.1"
  license:
    name: MIT
  description: >
    A video URL in; transcript, chapters, summaries, quotes, timestamps
    and embeddings out.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /video:
    post:
      summary: Submit a video URL for processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                embeddings:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [queued] }
        "401": { description: Unauthorized }
        "429": { description: Rate limited }
  /video/{id}:
    get:
      summary: Fetch job status and result.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job state (and result when done).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"
        "404": { description: Not found }
  /healthz:
    get:
      security: []
      summary: Liveness probe.
      responses:
        "200": { description: OK }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    VideoKnowledge:
      type: object
      properties:
        url: { type: string }
        durationSec: { type: number }
        language: { type: string }
        transcript:
          type: array
          items:
            type: object
            properties:
              t: { type: number }
              text: { type: string }
        chapters:
          type: array
          items:
            type: object
            properties:
              start: { type: number }
              title: { type: string }
        summary: { type: string }
        quotes: { type: array, items: { type: string } }
        entities: { type: array, items: { type: string } }
        embeddings:
          type: array
          items: { type: array, items: { type: number } }
    JobState:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [queued, running, done, failed] }
            result: { $ref: "#/components/schemas/VideoKnowledge" }
            error: { type: string }
