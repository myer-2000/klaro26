openapi: 3.1.0
info:
  title: Klaro26 Browser API
  version: "2026.1"
  license:
    name: MIT
  description: >
    Give an agent a task in natural language; get structured results back,
    not screenshots. Logins, CAPTCHAs and dynamic UIs handled.
servers:
  - url: http://localhost:8087
paths:
  /browse:
    post:
      summary: Give an agent a browser task.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task:
                  type: string
                return:
                  type: string
                  enum: [structured, markdown, screenshots]
                timeout:
                  type: integer
      responses:
        "202":
          description: Job accepted.
  /browse/{id}:
    get:
      summary: Fetch job status and result.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
