# Runs the Video Knowledge API on its own. `docker compose up video`.
# Postgres + Redis are included but commented — the scaffold uses in-memory
# adapters so it boots with zero external services. Uncomment to develop the
# production Store / Queue adapters.
services:
  video:
    build:
      context: .
      dockerfile: services/video/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - KLARO26_API_KEYS=klaro26_dev_key
