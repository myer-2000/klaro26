[project]
name = "klaro26"
version = "0.2.0"
description = "Official Python client for the Klaro26 APIs — clean, structured data for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Klaro26" }]
keywords = ["klaro26", "ai", "agents", "sdk", "api", "structured-data", "rag", "mcp"]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/myer-2000/klaro26"
Repository = "https://github.com/myer-2000/klaro26"
Issues = "https://github.com/myer-2000/klaro26/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klaro26"]
